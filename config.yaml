app:
  db_path: tasktracker.db
  host: 127.0.0.1
  port: 5000

ai:
  engine: gemini                 # gemini | local
  model: gemini-2.5-flash        # accurate (reasons about dates/sequencing);
                                 # use gemini-2.5-flash-lite for speed over quality
  endpoint: https://generativelanguage.googleapis.com/v1beta
  temperature: 0.2
  max_output_tokens: 16384       # big plans produce a lot of JSON
  timeout_seconds: 90
  retry_backoff_seconds: 1.5     # pause before the second sweep over the keys
  max_input_chars: 20000         # longer docs are clipped (head + tail kept)
  env_path: .env                 # GEMINI_API_KEYS=key1,key2,... lives here

tracking:
  due_soon_days: 3
