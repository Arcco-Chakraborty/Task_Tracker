{% extends "base.html" %}
{% block body %}
<h1 class="text-2xl font-bold mb-4">New project</h1>
{% if error %}<p class="bg-red-100 text-red-700 p-3 rounded mb-3">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data" class="space-y-4 bg-white p-5 rounded-lg shadow" data-upload-form>
  <div>
    <label class="block text-sm font-medium mb-1">Upload a PDF / .md / .txt</label>
    <input type="file" name="file" accept=".pdf,.md,.txt" class="block">
  </div>
  <p class="text-center text-slate-400 text-sm">or</p>
  <div>
    <label class="block text-sm font-medium mb-1">Describe the task</label>
    <textarea name="text" rows="6" class="w-full border rounded p-2" placeholder="Paste or write what needs to be done..."></textarea>
  </div>
  <div class="flex flex-wrap gap-4 text-sm">
    <label>Start date <input type="date" name="start_date" class="border rounded px-2 py-1"></label>
    <label>Target due date <input type="date" name="due_date" class="border rounded px-2 py-1"></label>
  </div>
  <button class="bg-blue-600 text-white px-4 py-2 rounded" data-upload-submit>Generate tracker</button>
</form>

<div class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4" data-upload-loading>
  <div class="w-full max-w-sm rounded bg-white p-6 text-center shadow-xl">
    <div class="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"></div>
    <h2 class="mt-4 text-lg font-semibold">Generating tracker</h2>
    <p class="mt-1 text-sm text-slate-500">Reading the document and asking Gemini to structure it.</p>
  </div>
</div>
{% endblock %}
